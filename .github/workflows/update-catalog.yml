name: Auto-update catalog.json

on:
  push:
    branches: [main]
    paths:
      - 'analyses/**'
      - 'generate-catalog.py'

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate catalog.json
        run: python generate-catalog.py

      - name: Commit updated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          # Only commit if there are changes
          git diff --staged --quiet || git commit -m "Auto-update catalog.json"
          git push
